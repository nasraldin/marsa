[package]
name = "marsa-vm-vz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
userspace-system-test = []
native-ipv4-system-test = []
ssh-transport-system-test = []

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
marsa-core = { path = "../marsa-core" }
marsa-proto = { path = "../marsa-proto", default-features = false }
marsa-vm = { path = "../marsa-vm" }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std", "NSArray", "NSError", "NSFileHandle", "NSObject", "NSString", "NSURL"
] }
objc2-virtualization = { version = "=0.3.2", default-features = false, features = [
    "std", "block2", "dispatch2", "VZBootLoader", "VZDiskImageStorageDeviceAttachment",
    "VZDirectoryShare", "VZDirectorySharingDeviceConfiguration",
    "VZEntropyDeviceConfiguration", "VZFileHandleNetworkDeviceAttachment", "VZFileHandleSerialPortAttachment", "VZLinuxBootLoader",
    "VZMemoryBalloonDevice", "VZMemoryBalloonDeviceConfiguration",
    "VZMACAddress", "VZNATNetworkDeviceAttachment", "VZNetworkDeviceAttachment", "VZNetworkDeviceConfiguration",
    "VZSerialPortAttachment", "VZSerialPortConfiguration", "VZSocketDevice", "VZSocketDeviceConfiguration",
    "VZSharedDirectory", "VZSingleDirectoryShare", "VZStorageDeviceAttachment", "VZStorageDeviceConfiguration",
    "VZVirtioBlockDeviceConfiguration", "VZVirtioConsoleDeviceSerialPortConfiguration",
    "VZVirtioEntropyDeviceConfiguration", "VZVirtioFileSystemDeviceConfiguration",
    "VZVirtioNetworkDeviceConfiguration", "VZVirtioTraditionalMemoryBalloonDevice",
    "VZVirtioTraditionalMemoryBalloonDeviceConfiguration",
    "VZVirtioSocketConnection", "VZVirtioSocketDevice", "VZVirtioSocketDeviceConfiguration",
    "VZVirtualMachine", "VZVirtualMachineConfiguration",
    "VZVirtualMachineDelegate"
] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
sha2 = { version = "0.11.1", default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
