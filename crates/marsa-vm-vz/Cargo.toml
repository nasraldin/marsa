[package]
name = "marsa-vm-vz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
marsa-vm = { path = "../marsa-vm" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std", "NSArray", "NSError", "NSFileHandle", "NSObject", "NSString", "NSURL"
] }
objc2-virtualization = { version = "=0.3.2", default-features = false, features = [
    "std", "block2", "dispatch2", "VZBootLoader", "VZDiskImageStorageDeviceAttachment",
    "VZEntropyDeviceConfiguration", "VZFileHandleSerialPortAttachment", "VZLinuxBootLoader",
    "VZNATNetworkDeviceAttachment", "VZNetworkDeviceAttachment", "VZNetworkDeviceConfiguration",
    "VZSerialPortAttachment", "VZSerialPortConfiguration", "VZSocketDeviceConfiguration",
    "VZStorageDeviceAttachment", "VZStorageDeviceConfiguration",
    "VZVirtioBlockDeviceConfiguration", "VZVirtioConsoleDeviceSerialPortConfiguration",
    "VZVirtioEntropyDeviceConfiguration", "VZVirtioNetworkDeviceConfiguration",
    "VZVirtioSocketDeviceConfiguration", "VZVirtualMachine", "VZVirtualMachineConfiguration",
    "VZVirtualMachineDelegate"
] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
