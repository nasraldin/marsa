[package]
name = "marsa-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
marsa-core = { path = "../marsa-core" }

[dev-dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

[build-dependencies]
rust-i18n-support = { version = "=4.2.4", features = ["codegen"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
marsa-l10n = { path = "../marsa-l10n" }
rust-i18n = "=4.2.4"
sys-locale = "=0.3.2"
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }
gpui-component.workspace = true
gpui-base = "=0.10.0"
gpui-kit-assets = "=0.10.0"
gpui.workspace = true
gpui-macos.workspace = true
vt100 = "=0.18.1"

[[test]]
name = "direction_render"
harness = false

[[test]]
name = "typography_native"
harness = false

[[test]]
name = "data_table_render"
harness = false
