[package]
name = "marsa-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
marsa-core = { path = "../marsa-core" }
marsa-proto = { path = "../marsa-proto", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
nix = { version = "0.32.0", features = ["feature", "fs", "mount", "net", "signal", "socket", "time"] }
base64 = "=0.22.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
serde_json = "=1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
http = "1.5.0"
percent-encoding = "=2.3.2"
tempfile = "3.27.0"
x509-cert = "0.3.1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }

[dev-dependencies]
base64 = "=0.22.1"
http = "1.5.0"
percent-encoding = "=2.3.2"
marsa-core = { path = "../marsa-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
marsa-proto = { path = "../marsa-proto", default-features = false }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
