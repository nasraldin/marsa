[package]
name = "marsa-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
marsa-proto = { path = "../marsa-proto", default-features = false }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.32.0", features = ["socket", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
