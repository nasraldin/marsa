[package]
name = "marsa-dockerproxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
marsa-core = { path = "../marsa-core" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.32.0", features = ["event", "fs"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "time"] }
tracing = "=0.1.44"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.32.0", features = ["user"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["sync"] }

[lints]
workspace = true
