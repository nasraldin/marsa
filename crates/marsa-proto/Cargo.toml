[package]
name = "marsa-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["host-api"]
host-api = ["dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build", "dep:serde", "dep:serde_json"]

[dependencies]
marsa-core = { path = "../marsa-core" }
prost = "=0.14.6"
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
thiserror = "=2.0.21"
tonic = { version = "=0.14.9", optional = true }
tonic-prost = { version = "=0.14.9", optional = true }

[build-dependencies]
prost-build = { version = "=0.14.6", default-features = false }
tonic-prost-build = { version = "=0.14.9", default-features = false, features = ["transport"], optional = true }

[lints]
workspace = true
