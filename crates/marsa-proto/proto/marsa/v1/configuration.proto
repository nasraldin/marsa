syntax = "proto3";

package marsa.v1;

// Versioned daemon configuration stored as TOML.
service Settings {
  rpc Get(GetSettingsRequest) returns (SettingsSnapshot);
  rpc Update(UpdateSettingsRequest) returns (SettingsSnapshot);
  rpc Watch(WatchSettingsRequest) returns (stream SettingsSnapshot);
}

// Manage the daemon's explicit shared-folder allowlist.
service Shares {
  rpc List(ListSharesRequest) returns (ListSharesResponse);
  rpc Add(AddShareRequest) returns (Share);
  rpc Remove(RemoveShareRequest) returns (RemoveShareResponse);
  rpc ResolveBind(ResolveBindRequest) returns (ResolveBindResponse);
}

// Discover the private Docker endpoint and explicitly register a local context.
service DockerDiscovery {
  rpc GetEndpoint(GetDockerEndpointRequest) returns (DockerEndpoint);
  rpc EnsureContext(EnsureDockerContextRequest) returns (EnsureDockerContextResponse);
  rpc EnableRegistryKeychain(EnableRegistryKeychainRequest) returns (EnableRegistryKeychainResponse);
}

message GetDockerEndpointRequest {}

message DockerEndpoint {
  string socket_path = 1;
  string docker_host = 2;
  string context_name = 3;
}

message EnsureDockerContextRequest {
  string request_id = 1;
}

message EnsureDockerContextResponse {
  DockerEndpoint endpoint = 1;
  // False when an identical context was already installed.
  bool created = 2;
}

// Called after the user explicitly approves saving Docker credentials in Keychain.
message EnableRegistryKeychainRequest {
  string request_id = 1;
}

message EnableRegistryKeychainResponse {
  // True only when this request added the opt-in to Docker's configuration.
  bool configured = 1;
}

// Report and configure the engine's networking.
service Network {
  rpc Status(NetworkStatusRequest) returns (NetworkStatus);
  rpc SetMode(SetNetworkModeRequest) returns (NetworkStatus);
  rpc ListForwardedPorts(ListForwardedPortsRequest) returns (ListForwardedPortsResponse);
  rpc PrepareProxyActivation(PrepareProxyActivationRequest) returns (ProxyActivationPreview);
  rpc ActivateProxy(ActivateProxyRequest) returns (ProxyActivationResult);
}

message GetSettingsRequest {}
message WatchSettingsRequest {}

message SettingsSnapshot {
  // The canonical full configuration. Treat as sensitive.
  string settings_toml = 1;
  uint64 revision = 2;
  // Boot-time preferences differ from the configuration applied to the VM.
  bool restart_required = 3;
}

message UpdateSettingsRequest {
  string request_id = 1;
  string settings_toml = 2;
  // Prevents overwriting an update made after the client's last read.
  uint64 expected_revision = 3;
}

message ListSharesRequest {}

message ListSharesResponse {
  repeated Share shares = 1;
}

message Share {
  string id = 1;
  string host_path = 2;
  bool read_only = 3;
  bool requires_restart = 4;
}

message AddShareRequest {
  string request_id = 1;
  string host_path = 2;
  bool read_only = 3;
  // Set when this request answers an outstanding bind mount prompt.
  optional string approval_id = 4;
  bool persist = 5;
}

message RemoveShareRequest {
  string request_id = 1;
  string share_id = 2;
}

message RemoveShareResponse {
  bool requires_restart = 1;
}

// Owner-only prompts for a Docker create request with an unshared bind source.
message BindApprovalList {
  repeated BindApproval approvals = 1;
}

message BindApproval {
  string id = 1;
  repeated string directories = 2;
  int64 expires_at_unix_millis = 3;
}

enum BindApprovalDecision {
  BIND_APPROVAL_DECISION_UNSPECIFIED = 0;
  BIND_APPROVAL_DECISION_ONCE = 1;
  BIND_APPROVAL_DECISION_PERSIST = 2;
  BIND_APPROVAL_DECISION_DENY = 3;
}

message ResolveBindRequest {
  string request_id = 1;
  string approval_id = 2;
  BindApprovalDecision decision = 3;
}

message ResolveBindResponse {
  // Static backends require the confirmed share to be applied at the next boot.
  bool requires_restart = 1;
}

message NetworkStatusRequest {}

message NetworkStatus {
  NetworkMode configured_mode = 1;
  NetworkMode active_mode = 2;
  optional string reason = 3;
  optional string guest_address = 4;
  optional string gateway_address = 5;
}

enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;
  NETWORK_MODE_AUTO = 1;
  NETWORK_MODE_NAT = 2;
  NETWORK_MODE_USERSPACE = 3;
}

message SetNetworkModeRequest {
  string request_id = 1;
  NetworkMode mode = 2;
}

message ListForwardedPortsRequest {}

message ListForwardedPortsResponse {
  repeated ForwardedPort ports = 1;
}

message ForwardedPort {
  string host_address = 1;
  uint32 host_port = 2;
  uint32 guest_port = 3;
  PortTransport transport = 4;
  string container_id = 5;
}

enum PortTransport {
  PORT_TRANSPORT_UNSPECIFIED = 0;
  PORT_TRANSPORT_TCP = 1;
  PORT_TRANSPORT_UDP = 2;
}

// Prepare one activation of the credential-free proxy in pending settings.
message PrepareProxyActivationRequest {
  uint64 expected_settings_revision = 1;
}

message ProxyActivationPreview {
  // Process-local, short-lived and one use. Treat as sensitive.
  bytes approval_token = 1;
  uint64 settings_revision = 2;
  // The VM will be stopped; workloads, builds, streams and one-session shares
  // may be interrupted. A capacity or container count is not consent.
  bool interrupts_running_engine = 3;
  uint32 approval_valid_seconds = 4;
  repeated ProxyActivationImpact potential_interruptions = 5;
}

enum ProxyActivationImpact {
  PROXY_ACTIVATION_IMPACT_UNSPECIFIED = 0;
  PROXY_ACTIVATION_IMPACT_CONTAINERS = 1;
  PROXY_ACTIVATION_IMPACT_BUILDS = 2;
  PROXY_ACTIVATION_IMPACT_ATTACHED_STREAMS = 3;
  PROXY_ACTIVATION_IMPACT_SESSION_SHARES = 4;
}

message ActivateProxyRequest {
  string request_id = 1;
  uint64 expected_settings_revision = 2;
  bytes approval_token = 3;
  // Set after the authenticated owner reviews the preview and explicitly agrees.
  bool approved = 4;
}

message ProxyActivationResult {
  ProxyActivationOutcome outcome = 1;
  ProxyActivationFailureStage failure_stage = 2;
}

enum ProxyActivationOutcome {
  PROXY_ACTIVATION_OUTCOME_UNSPECIFIED = 0;
  PROXY_ACTIVATION_OUTCOME_APPLIED = 1;
  PROXY_ACTIVATION_OUTCOME_APPLIED_DURABILITY_UNCERTAIN = 2;
  PROXY_ACTIVATION_OUTCOME_PRIOR_POLICY_KEPT = 3;
  PROXY_ACTIVATION_OUTCOME_PRIOR_ENGINE_RESTORED = 4;
  PROXY_ACTIVATION_OUTCOME_ENGINE_RECOVERY_REQUIRED = 5;
}

enum ProxyActivationFailureStage {
  PROXY_ACTIVATION_FAILURE_STAGE_UNSPECIFIED = 0;
  PROXY_ACTIVATION_FAILURE_STAGE_STOP = 1;
  PROXY_ACTIVATION_FAILURE_STAGE_START = 2;
  PROXY_ACTIVATION_FAILURE_STAGE_PERSIST = 3;
  PROXY_ACTIVATION_FAILURE_STAGE_SHUTDOWN = 4;
}
