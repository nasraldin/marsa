syntax = "proto3";

package marsa.guest.v1;

// Complete resolver, proxy, and engine host alias configuration.
message ConfigureNetwork {
  repeated string dns_servers = 1;
  repeated string search_domains = 2;
  Proxy proxy = 3;
  repeated HostAlias host_aliases = 4;
  // Present only for the native NAT attachment. Empty rules use the default servers.
  NativeDns native_dns = 5;
  // Absent during resolver-only refreshes. Present on cold boot with overrides.
  RegistryConfig registries = 6;
}

// Docker daemon registry options from the owner configuration.
message RegistryConfig {
  repeated string mirrors = 1;
  repeated string insecure = 2;
}

// Supplemental host resolver routes, independent of search suffix expansion.
message NativeDns {
  repeated DnsRoute routes = 1;
  // An explicit override must be provisioned before starting Docker.
  bool explicit_servers = 2;
}

// Queries below this suffix use only these servers. An empty set is local-only.
message DnsRoute {
  string domain = 1;
  repeated string servers = 2;
  uint32 port = 3; // Zero selects the standard DNS port.
}

// Proxy URLs for the engine. Treat them as sensitive and omit them from logs.
message Proxy {
  optional string http_url = 1;
  optional string https_url = 2;
  repeated string no_proxy = 3;
}

// Engine DNS override mapping a host name to an IPv4 or IPv6 address.
message HostAlias {
  string name = 1;
  string address = 2;
}

// Replacement set of host-trusted certificates in DER form.
message InstallCertificates {
  repeated bytes certificates_der = 1;
}

// The guest's lifecycle event for a published port binding.
message PortEvent {
  PortAction action = 1;
  Transport transport = 2;
  string container_id = 3;
  string bind_address = 4;
  uint32 published_port = 5;
  uint32 container_port = 6;
}

// Lifecycle of a published port.
enum PortAction {
  PORT_ACTION_UNSPECIFIED = 0;
  PORT_ACTION_OPENED = 1;
  PORT_ACTION_CLOSED = 2;
}

// IP transport for a published port.
enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_TCP = 1;
  TRANSPORT_UDP = 2;
}

// Release Docker after a successful SetTime. Safe to repeat on the same session.
message StartEngine {}

// Probe registry-1.docker.io:443/v2/ from a deferred engine session.
message ProbeEgress {
  // IPv4 address selected by the host's resolver, in network byte order.
  bytes address_v4 = 1;
}

// Diagnostic stage with no peer-supplied text.
message EgressResult {
  EgressStage stage = 1;
}

// Result of the comparison probe, independently of Docker readiness.
enum EgressStage {
  EGRESS_STAGE_UNSPECIFIED = 0;
  EGRESS_STAGE_HEALTHY = 1;
  EGRESS_STAGE_DNS = 2;
  EGRESS_STAGE_ROUTE = 3;
  EGRESS_STAGE_TCP = 4;
  EGRESS_STAGE_TLS = 5;
  EGRESS_STAGE_HTTP = 6;
  EGRESS_STAGE_POLICY = 7;
}
