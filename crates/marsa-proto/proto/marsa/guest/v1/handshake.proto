syntax = "proto3";

package marsa.guest.v1;

// Major must match. The host selects the lower supported minor.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// Measured elapsed time of one guest startup stage.
message BootTiming {
  string stage = 1;
  uint64 elapsed_millis = 2;
}

// A version from the bundled guest image manifest.
message ComponentVersion {
  string name = 1;
  string version = 2;
}

// First message on a newly connected guest control socket.
message Hello {
  ProtocolVersion protocol = 1;
  string image_version = 2;
  repeated ComponentVersion components = 3;
  repeated BootTiming boot_timings = 4;
}

// Accepted protocol version. The host closes the connection on incompatibility.
message HelloAck {
  ProtocolVersion protocol = 1;
  // Protocol 1.1 or later. SetTime synchronizes the clock without starting Docker.
  bool defer_engine_start = 2;
}
