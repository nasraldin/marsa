name: Dependency audit

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Check Cargo.lock against RustSec
        shell: bash
        env:
          CARGO_AUDIT_VERSION: "0.23.0"
          CARGO_AUDIT_SHA256: b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          trap 'rm -rf -- "$audit_dir"' EXIT
          release="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}"
          asset="$release.tgz"
          archive="$audit_dir/$asset"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' --output "$archive" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/$asset"
          printf '%s  %s\n' "$CARGO_AUDIT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --to-stdout --file="$archive" "$release/cargo-audit" > "$audit_dir/cargo-audit"
          chmod 0700 "$audit_dir/cargo-audit"
          python3 .github/scripts/audit-path-dependencies.py lock > "$audit_dir/Cargo.lock"
          "$audit_dir/cargo-audit" audit --file "$audit_dir/Cargo.lock" --deny warnings
