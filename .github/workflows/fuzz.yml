name: Parser fuzzing

on:
  schedule:
    - cron: "19 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fuzz.yml'
      - 'fuzz/**'

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: bash .github/scripts/install-ci-tools.sh
      - name: Check the fuzz dependency graph
        run: bash fuzz/check-dependencies.sh
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz the parsers
        run: bash fuzz/run.sh "$RUNNER_TEMP/marsa-fuzz"
      - name: Save crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parser-fuzz-crashes
          path: ${{ runner.temp }}/marsa-fuzz/run.*/crashes/**/*
          if-no-files-found: ignore
