[graph]
all-features = true

[licenses]
include-build = true
include-dev = true
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Current upstream code generators require these incompatible versions.
# Recheck after upgrading Prost, Tonic, or petgraph.
skip = [
    { name = "hashbrown", version = "=0.15.5", reason = "Prost code generation uses petgraph 0.8.3, which requires hashbrown 0.15." },
    { name = "prettyplease", version = "=0.2.37", reason = "Tonic 0.14.9 generates code with prettyplease 0.2, while Prost uses 0.3." },
    { name = "syn", version = "=2.0.119", reason = "Tonic code generation, Prost derive, and tracing attributes require syn 2." },
]
deny = [
    { name = "failure", reason = "Use thiserror for library error types and anyhow for binary entry points." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
