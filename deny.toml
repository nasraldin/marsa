[graph]
all-features = true

[licenses]
include-build = true
include-dev = true
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "failure", reason = "Use thiserror for library error types and anyhow for binary entry points." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
