[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
marsa-core = { path = "../crates/marsa-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
toml = "1.2.2"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_env = "gnu")))'.dependencies]
getrandom = "=0.4.3"
nix = { version = "=0.32.0", features = ["dir", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDate", "CFDictionary", "CFString", "CFURL"] }
objc2-security = { version = "=0.3.2", default-features = false, features = ["CSCommon", "SecCode", "SecStaticCode"] }
